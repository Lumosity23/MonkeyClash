<div class="page pageLoading" id="pageLoading">
  <!-- MonkeyClash: "clash" falls on the wordmark and knocks "type" off -->
  <div class="clashIntro" aria-hidden="true">
    <span class="monkey">monkey</span>
    <span class="tail">
      <span class="type">type</span>
      <span class="clash">clash</span>
    </span>
  </div>
  <div class="spinner">
    <i class="fas fa-fw fa-spin fa-circle-notch"></i>
  </div>
  <div class="error hidden">
    <i class="fas fa-fw fa-times"></i>
  </div>
  <div class="bar hidden">
    <div class="fill"></div>
  </div>
  <div class="text hidden">Loading...</div>
</div>
