# The player's IP: Cloudflare sends it in CF-Connecting-IP, direct access on
# the LAN has none and uses the connection's address.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # tribe server (socket.io, websockets)
    location /socket.io/ {
        proxy_pass http://tribe:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_read_timeout 1h;
    }

    # duel stats, served by the tribe server
    location /tribe-api/ {
        proxy_pass http://tribe:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
    }

    # monkeytype backend, the /api prefix is stripped
    location /api/ {
        proxy_pass http://backend:5005/;
        proxy_set_header Host $host;
        # the backend trusts one proxy (us), so it must see the player's IP
        # here, not the cloudflared container's
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }
}
